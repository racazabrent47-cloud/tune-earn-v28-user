name: Tune Earn V33 Final Private APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'
      - run: |
          rm -rf android
          flutter create --project-name tune_earn_v33_final_private --org com.tuneearn.v33 --platforms android .
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: TuneEarn-V33-FINAL-PRIVATE-APK-WORLD-FEED
          path: build/app/outputs/flutter-apk/app-release.apk
